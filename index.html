<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, shrink-to-fit=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="https://static.matterport.com/showcase-sdk/bootstrap/3.0.0-0-g0517b8d76c/sdk.js"></script>
  
  <style>
    .overlay-container {
      position: relative;
      width: 800px;
      height: 500px;
    }
    #my-iot-overlay {
      display: none;
      position: absolute;
      z-index: 10; /* Ensures it sits on top of the iframe */
      background: rgba(0, 0, 0, 0.7);
      color: green;
      padding: 10px;
      padding: 15px;
      border-radius: 8px;
      pointer-events: none;
      /* Allows you to click the Matterport space through the tag */
    }
  </style>
</head>

<body>
  <h1>Embed SDK - Overlay Example</h1>
  <div class="overlay-container">
    <iframe 
    id="showcase"
    width="100%" height="100%" 
    frameborder="0" allowfullscreen></iframe>
    <div id="my-iot-overlay">
      <div class="title">IoT Device Info</div>
      <div class="temp-value" id="live-temp">--°C</div>
      <div class="status">Status: <span id="status-text">Online</span></div>
    </div>
  </div>
  <script type="module" src="./index.ts"></script>
</body>

</html>
